# lx-server 配置文件（可选）。启动方式: lx-server -c config.toml
# 不带 -c 时不读取任何配置文件，全部使用内置默认值（即本文件里的值）。
# 修改后重启生效；环境变量（PORT / BIND_IP / DATA_PATH / LOG_LEVEL / PLAYER_PASSWORD / OUTBOUND_PROXY）优先于本文件。

[server]
name = "lx-server"
bind_ip = "0.0.0.0"
port = 9527
# 数据目录（自定义音源、用户数据、缓存），不存在会自动创建。
# 相对路径以本配置文件所在目录为基准（不使用 -c 时以当前目录为基准），也可写绝对路径。
data_dir = "data"
# 日志等级：off / error / warn / info / debug / trace
log_level = "info"

[auth]
# 访问密码（唯一登录入口 /music/login）。留空 = 不启用认证；填写即启用
password = ""

[proxy]
# 出口代理，例如 "socks5://127.0.0.1:1080" 或 "http://127.0.0.1:7890"，留空直连
outbound = ""
real_ip_header = "x-real-ip"
