# lx-rs 配置文件。运行时不依赖 Node.js，单二进制 + 外置 data/。
# 修改后重启生效；环境变量优先级高于本文件。

[server]
name = "lx-server"
bind_ip = "0.0.0.0"
port = 9527
data_dir = "data"

[auth]
# 访问密码（唯一登录入口 /music/login）。留空 = 不启用认证；填写即启用
# 也可用环境变量 PLAYER_PASSWORD 覆盖
password = ""

[proxy]
# 出口代理，例如 "socks5://127.0.0.1:1080" 或 "http://127.0.0.1:7890"，留空直连
outbound = ""
real_ip_header = "x-real-ip"
